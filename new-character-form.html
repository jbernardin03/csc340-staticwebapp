<!DOCTYPE html>
<html>
<head>
    <title>Add a New One Piece Character</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Add a New One Piece Character</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="details.html">Details</a>
        <a href="about.html">About</a>
        <a href="new-character-form.html">Add Character</a>
    </nav>
</header>
<div class="container">

    <!-- Example Character Card -->
    <div class="card" style="max-width:300px; margin: 0 auto 30px auto;">
        <img src="images/chopper.jpg" alt="Tony Tony Chopper">
        <h3>Tony Tony Chopper</h3>
        <p>Doctor of the Strawhat Crew</p>
    </div>

<div class="container">

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Character name (e.g., Tony Tony Chopper)" required>

        <label>Affiliation / Crew:</label>
        <input type="text" placeholder="Pirate, Cross Guild, Marine, Revolutionary Army, Royalty, etc." required>

        <label>Role:</label>
        <input type="text" placeholder="Archaeologist, Navigator, Captain, Crewmember, etc." required>

        <label>Image URL:</label>
        <input type="text" placeholder="Link to character image" required>

        <label>Short Description:</label>
        <textarea placeholder="Brief summary of the character" required></textarea>

        <button type="submit">Add Character</button>
    </form>

</div>

</body>
</html>
